name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KENSHOO_TEST_PG_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26" # the Go the image is built with (see Dockerfile)
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Integration tests must run, not skip
        run: |
          set -o pipefail
          go test -race -count=1 -v ./internal/pgdb | tee "$RUNNER_TEMP/pgdb.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/pgdb.log"; then
            echo "pgdb tests were skipped: KENSHOO_TEST_PG_DSN is not reaching them" >&2
            exit 1
          fi

  compat:
    runs-on: ubuntu-24.04
    env:
      # No Postgres service in this job: blank the workflow-level DSN so the integration tests skip.
      KENSHOO_TEST_PG_DSN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Vet and unit-test on the oldest Go that go.mod allows
        run: go vet ./... && go test ./...

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --build-arg VERSION=ci -t kenshoo:ci .
      - name: Smoke test the image
        run: |
          set -eu
          docker run --rm kenshoo:ci --version
          docker run --rm --entrypoint pg_restore kenshoo:ci --version | grep -q "(PostgreSQL) 16"
          test "$(docker run --rm --entrypoint id kenshoo:ci -u)" = "65532"
          docker run --rm -v "$PWD/examples:/etc/kenshoo:ro" kenshoo:ci --config /etc/kenshoo/kenshoo.example.yaml --validate
          code=0
          docker run --rm -v "$PWD/examples:/etc/kenshoo:ro" kenshoo:ci --config /etc/kenshoo/kenshoo.example.yaml || code=$?
          test "$code" = 2
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kenshoo:ci
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: table

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          helm version --short
          yq --version
      - name: Lint the chart
        run: helm lint deployments/helm -f deployments/helm/ci/example-values.yaml --strict
      - name: Test the chart
        run: deployments/helm/test.sh
